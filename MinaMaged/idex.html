<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>معلومات عن الكنيسة</title>

<style>
body{
    font-family:Tahoma;
    background:#f3e7d3;
    color:#4b2e1f;
    text-align:center;
    margin:0;
}
header{
    background:#70452c;
    color:white;
    padding:25px;
}
.box{
    background:white;
    margin:30px auto;
    padding:25px;
    max-width:800px;
    border-radius:20px;
    box-shadow:0 5px 15px #999;
}
h2{color:#8b5a35;}
p{font-size:18px;line-height:2;}
</style>
</head>

<body>

<header>
    <h1>✝ معلومات عن الكنيسة ✝</h1>
    <p>كنيسة السيدة العذراء مريم الأثرية بمسطرد</p>
</header>

<div class="box">
    <h2>⛪ نبذة عن الكنيسة</h2>
    <p>
    كنيسة السيدة العذراء مريم الأثرية بمسطرد،
    وهي من الأماكن المرتبطة بمسار العائلة المقدسة في مصر.
    </p>
</div>

<div class="box">
    <h2>📜 معلومات تاريخية</h2>
    <p>
    تتميز الكنيسة بقيمتها التاريخية والروحية،
    وترتبط بزيارة العائلة المقدسة لمصر.
    </p>
</div>

</body>
</html>
